spring:
  application:
    name: smart-certificate-backend
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    password-reset-ttl-seconds: ${PASSWORD_RESET_TTL_SECONDS:3600}
    invitation-ttl-seconds: ${INVITATION_TTL_SECONDS:604800}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    self-registration-enabled: ${SELF_REGISTRATION_ENABLED:true}
  storage:
    type: ${STORAGE_TYPE:local}
    local-root: ${STORAGE_LOCAL_ROOT:./data/storage}
    signed-url-secret: ${STORAGE_SIGNED_URL_SECRET}
    signed-url-ttl-seconds: ${STORAGE_SIGNED_URL_TTL_SECONDS:300}
    max-asset-size-bytes: ${MAX_ASSET_SIZE_BYTES:5242880}
    s3-bucket: ${AWS_S3_BUCKET:}
    s3-region: ${AWS_REGION:ap-southeast-2}
    s3-prefix: ${AWS_S3_PREFIX:}
    s3-endpoint: ${AWS_S3_ENDPOINT:}
    s3-kms-key-id: ${AWS_S3_KMS_KEY_ID:}
  verification:
    public-base-url: ${PUBLIC_APP_BASE_URL:http://localhost:3000}
    rate-limit-per-minute: ${PUBLIC_VERIFY_RATE_LIMIT_PER_MINUTE:60}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSX} %-5level [%X{requestId:-none}] %logger{36} - %msg%n"
