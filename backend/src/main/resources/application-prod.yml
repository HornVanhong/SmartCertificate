spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SmartCertProdHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 25
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: 20
    connection-timeout: 20000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: smart-certificate-backend
      environment: ${ENVIRONMENT:production}

springdoc:
  api-docs:
    enabled: ${ENABLE_SWAGGER:false}
  swagger-ui:
    enabled: ${ENABLE_SWAGGER:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    self-registration-enabled: ${SELF_REGISTRATION_ENABLED:false}
  storage:
    type: ${STORAGE_TYPE:s3}
    s3-bucket: ${AWS_S3_BUCKET:smart-certificate-vault}
    s3-region: ${AWS_REGION:ap-southeast-2}
    s3-prefix: ${AWS_S3_PREFIX:production}
    s3-kms-key-id: ${AWS_S3_KMS_KEY_ID:}
    signed-url-secret: ${STORAGE_SIGNED_URL_SECRET}
    signed-url-ttl-seconds: ${STORAGE_SIGNED_URL_TTL_SECONDS:300}
    max-asset-size-bytes: ${MAX_ASSET_SIZE_BYTES:5242880}
  verification:
    public-base-url: ${PUBLIC_APP_BASE_URL}
    rate-limit-per-minute: ${PUBLIC_VERIFY_RATE_LIMIT_PER_MINUTE:60}

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.smartcertificate: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
