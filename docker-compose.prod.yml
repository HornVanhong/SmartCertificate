services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-certificate-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_certificate}
      POSTGRES_USER: ${POSTGRES_USER:-smart_cert_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_cert_prod_user} -d ${POSTGRES_DB:-smart_certificate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-certificate-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smart_certificate}
      DB_USERNAME: ${POSTGRES_USER:-smart_cert_prod_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://smartcert.yourdomain.com}
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-https://smartcert.yourdomain.com}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      STORAGE_SIGNED_URL_SECRET: ${STORAGE_SIGNED_URL_SECRET:?Set STORAGE_SIGNED_URL_SECRET in .env.prod}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_ROOT: /app/data/storage
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_S3_PREFIX: ${AWS_S3_PREFIX:-prod}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - storage_prod_data:/app/data/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    container_name: smart-certificate-web-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal-net

  proxy:
    image: caddy:2.9-alpine
    container_name: smart-certificate-proxy-prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - internal-net

volumes:
  postgres_prod_data:
  storage_prod_data:
  caddy_data:
  caddy_config:

networks:
  internal-net:
    driver: bridge
