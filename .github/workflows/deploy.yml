name: Deploy to Production (AWS ECS)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

jobs:
  verify:
    name: Pre-deployment Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_certificate
          POSTGRES_USER: smart_cert_user
          POSTGRES_PASSWORD: smart_cert_local_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Backend (Spotless & Full Suite)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: local
          DB_URL: jdbc:postgresql://localhost:5432/smart_certificate
          DB_USERNAME: smart_cert_user
          DB_PASSWORD: smart_cert_local_pass
        run: |
          ./mvnw -B spotless:check
          ./mvnw -B verify

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Frontend (Format, Lint, Types, Tests, Build)
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build

  build-and-deploy:
    name: Build Images & Deploy to ECS
    needs: [verify]
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECS_CLUSTER: smart-cert-prod-cluster
      BACKEND_SERVICE: smart-cert-prod-backend
      FRONTEND_SERVICE: smart-cert-prod-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        if: ${{ env.ECR_REGISTRY != '' }}
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        if: ${{ env.ECR_REGISTRY != '' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend Docker Image
        if: ${{ env.ECR_REGISTRY != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/smart-certificate-backend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/smart-certificate-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Docker Image
        if: ${{ env.ECR_REGISTRY != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/smart-certificate-frontend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/smart-certificate-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Backend to Amazon ECS
        if: ${{ env.ECR_REGISTRY != '' }}
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.BACKEND_SERVICE }}" \
            --force-new-deployment

      - name: Deploy Frontend to Amazon ECS
        if: ${{ env.ECR_REGISTRY != '' }}
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.FRONTEND_SERVICE }}" \
            --force-new-deployment

      - name: Wait for Services Stability
        if: ${{ env.ECR_REGISTRY != '' }}
        run: |
          echo "[INFO] Waiting for backend ECS service deployment to stabilize..."
          aws ecs wait services-stable --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.BACKEND_SERVICE }}"
          echo "[INFO] Waiting for frontend ECS service deployment to stabilize..."
          aws ecs wait services-stable --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.FRONTEND_SERVICE }}"
          echo "[SUCCESS] Zero-downtime deployment finished successfully."
