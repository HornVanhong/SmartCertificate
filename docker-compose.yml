services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-certificate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_certificate}
      POSTGRES_USER: ${POSTGRES_USER:-smart_cert_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_cert_local_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smart_cert_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_cert_user} -d ${POSTGRES_DB:-smart_certificate}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smart_cert_pgdata:
